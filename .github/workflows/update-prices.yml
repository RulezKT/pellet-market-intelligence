name: Collect prices
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: price-data-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect
      - run: npm run validate:data
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: reports/collection.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/price-update
          title: 'Update verified market observations'
          commit-message: 'Update permitted market observations'
          body: 'Validated source observations. Review the collection report and source status before merging. No automated retail sources are enabled initially.'
          add-paths: src/data/*.json
          delete-branch: true
