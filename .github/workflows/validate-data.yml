name: Validate data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /pellet-market-intelligence
